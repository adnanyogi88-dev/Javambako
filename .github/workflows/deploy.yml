name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Daily at 10:00 WIB. GitHub may queue scheduled runs.
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication-window:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - id: window
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "allowed=true" >> "$GITHUB_OUTPUT"
  build:
    needs: publication-window
    if: needs.publication-window.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://javatobacco.com
          BASE_PATH: /
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
